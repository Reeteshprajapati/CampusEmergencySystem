server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: campusguard-backend
  profiles:
    active: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false

---
# Development Profile (Embedded Persistent H2 Database)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/campusguarddb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# MySQL / Production Profile
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusguard_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
# JWT & App Configuration
app:
  jwt:
    secret: 9a6f8b2c4e1d3f5a7b9c0d2e4f6a8b1c3d5e7f9a0b2c4d6e8f1a3b5c7d9e0f1a2b
    expiration-ms: 86400000 # 24 hours
  ai:
    groq-key: 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

# SpringDoc OpenAPI Documentation
